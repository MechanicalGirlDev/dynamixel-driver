[workspace]
resolver = "3"
members = ["."]

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
authors = ["nop <noplab90@gmail.com>"]
repository = "https://github.com/MechanicalGirlDev/dynamixel-driver"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
unused_results = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
std_instead_of_core = "warn"
std_instead_of_alloc = "warn"

[package]
name = "dynamixel-serial"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Serial (TTL/RS-485) transport and CLI for Dynamixel X-series servos via rustypot"

[lib]
name = "dynamixel_serial"
path = "src/lib.rs"

[[bin]]
name = "dynamixel"
path = "src/main.rs"

[dependencies]
rustypot = "1.5"
serialport = "4"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[lints]
workspace = true
